# /etc/ssh/sshd_config.d/50-gliff-tunnel.conf on the VPS.
# gtunnel: may only hold the reverse tunnel (VPS localhost:2222 -> desktop sshd).
# gjump:   may only connect to that tunnel (the phone's jump hop).
Match User gtunnel
    ClientAliveInterval 15
    ClientAliveCountMax 3
    AllowTcpForwarding remote
    PermitListen localhost:2222
    GatewayPorts no
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    PasswordAuthentication no
Match User gjump
    AllowTcpForwarding local
    PermitOpen localhost:2222
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    PasswordAuthentication no
