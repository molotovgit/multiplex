# /etc/ssh/sshd_config.d/10-hardening.conf on the desktop machine.
# Key-only logins, one user, home network plus the tailnet.
# Check with `sshd -t` before restarting sshd.
PermitRootLogin no
PubkeyAuthentication yes
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
MaxAuthTries 3
LoginGraceTime 20
X11Forwarding no
AllowAgentForwarding no
PermitUserEnvironment no
ClientAliveInterval 30
ClientAliveCountMax 3
AllowUsers YOUR_USER@192.168.1.0/24 YOUR_USER@100.64.0.0/10 YOUR_USER@fd7a:115c:a1e0::/48
