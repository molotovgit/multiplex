[package]
name = "multiplex-app"
version = "0.1.0"
edition = "2021"
description = "The Multiplex window for Omarchy: paired phones, pairing, what each phone may do, sending files."
publish = false

[[bin]]
name = "multiplex-app"
path = "src/main.rs"

[dependencies]
cxx = "1.0.176"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
libc = "0.2"
qrcode = { version = "0.14", default-features = false }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
